<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS & Solo Complete Discography Guide</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header { text-align: center; padding: 40px 0 20px 0; }
        header h1 { font-size: 2.5rem; color: #d8b4fe; margin-bottom: 8px; }
        header p { color: #a7a7a7; font-size: 1rem; }
        
        .controls {
            max-width: 1200px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .search-input {
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #242424;
            color: #fff;
            width: 100%;
            max-width: 450px;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus { border-color: #1db954; }

        /* Botones de filtro por categoría/artista */
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 900px;
        }
        .filter-btn {
            background-color: #242424;
            color: #b3b3b3;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #1db954;
            color: #000;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: #181818;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .card:hover {
            background-color: #282828;
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .card-info h3 { font-size: 1rem; margin-bottom: 4px; color: #fff; }
        .card-info p { font-size: 0.8rem; color: #b3b3b3; margin-bottom: 12px; }
        .spotify-btn {
            display: block;
            text-align: center;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .spotify-btn:hover { background-color: #1ed760; }
        .loading { text-align: center; grid-column: 1 / -1; color: #b3b3b3; padding: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BTS & Solo Discography Guide</h1>
            <p>Explora la discografía grupal y canciones individuales</p>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar canción, álbum o año...">
            
            <!-- Botones de Filtro (puedes agregar o quitar según tus categorías en el JSON) -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todo</button>
                <button class="filter-btn" data-filter="BTS">BTS (Grupal)</button>
                <button class="filter-btn" data-filter="Jung Kook">Jung Kook</button>
                <button class="filter-btn" data-filter="Jimin">Jimin</button>
                <button class="filter-btn" data-filter="V">V</button>
                <button class="filter-btn" data-filter="SUGA">SUGA / Agust D</button>
                <button class="filter-btn" data-filter="j-hope">j-hope</button>
                <button class="filter-btn" data-filter="RM">RM</button>
                <button class="filter-btn" data-filter="Jin">Jin</button>
            </div>
        </div>

        <div class="grid" id="discographyGrid">
            <div class="loading">Cargando catálogo...</div>
        </div>
    </div>

    <script>
        let allMusicData = [];
        let currentFilter = 'all';
        const grid = document.getElementById('discographyGrid');

        // Cargar datos del archivo discography.json
        fetch('discography.json')
            .then(response => response.json())
            .then(data => {
                allMusicData = data;
                renderCards(allMusicData);
            })
            .catch(error => {
                grid.innerHTML = '<div class="loading" style="color:#ff5555;">Error al cargar el archivo discography.json.</div>';
            });

        function renderCards(items) {
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = '<div class="loading">No se encontraron resultados.</div>';
                return;
            }
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="card-info">
                            <h3>${item.title}</h3>
                            <p>${item.year} • ${item.artist}</p>
                        </div>
                        <a href="${item.spotifyUrl}" target="_blank" class="spotify-btn">Escuchar en Spotify</a>
                    </div>
                `;
            });
        }

        // Función combinada de búsqueda y filtros
        function filterAndRender() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allMusicData.filter(item => {
                const matchesCategory = (currentFilter === 'all') || item.artist.toLowerCase().includes(currentFilter.toLowerCase());
                const matchesSearch = item.title.toLowerCase().includes(term) || 
                                      item.artist.toLowerCase().includes(term) ||
                                      item.year.includes(term);
                return matchesCategory && matchesSearch;
            });

            renderCards(filtered);
        }

        // Evento de búsqueda
        document.getElementById('searchInput').addEventListener('input', filterAndRender);

        // Eventos de los botones de categoría
        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                filterAndRender();
            });
        });
    </script>
</body>
</html>
