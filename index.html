<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMY Playlist</title>
    <style>
        /* Tus estilos originales */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header { text-align: center; padding: 30px 0 20px 0; }
        header small { color: #d8b4fe; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        header h2 { font-size: 2.5rem; color: #fff; margin: 5px 0; }
        header p { color: #a7a7a7; font-size: 1rem; margin-bottom: 20px; }

        .track-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .track-chips span {
            background-color: #242424;
            color: #d8b4fe;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #333;
            transition: all 0.2s ease;
        }
        .track-chips span:hover, .track-chips span.active {
            background-color: #1db954;
            color: #000;
            border-color: #1db954;
        }

        .section-heading {
            margin: 30px 0 15px 0;
            border-bottom: 1px solid #282828;
            padding-bottom: 10px;
        }
        .section-heading h2 { font-size: 1.5rem; color: #fff; }

        /* Estilo para la cuadrícula de los cuadritos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #181818;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .card:hover {
            background-color: #282828;
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .card-info h3 { font-size: 0.95rem; margin-bottom: 4px; color: #fff; }
        .card-info p { font-size: 0.8rem; color: #b3b3b3; margin-bottom: 12px; }
        .spotify-btn {
            display: block;
            text-align: center;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .spotify-btn:hover { background-color: #1ed760; }
        .loading-state { text-align: center; grid-column: 1 / -1; color: #b3b3b3; padding: 40px; }
    </style>
</head>
<body>

    <header>
        <small>BTS</small>
        <h2>ARIRANG</h2>
        <p>El catálogo inicial de ARMY Streaming Combo.</p>
    </header>

    <!-- Tus chips originales -->
    <div class="track-chips" id="filterChips">
        <span class="active" data-filter="all">SWIM · 6 lanzamientos</span>
        <span data-filter="NORMAL">NORMAL · 4 lanzamientos</span>
        <span data-filter="COME OVER">COME OVER · 1 lanzamiento</span>
        <span data-filter="Hooligan">Hooligan · 2 lanzamientos</span>
        <span data-filter="Aliens">Aliens · 2 lanzamientos</span>
        <span data-filter="FYA">FYA · 2 lanzamientos</span>
    </div>

    <article>
        <div class="section-heading">
            <h2>Canciones y versiones</h2>
        </div>

        <!-- Aquí es donde se inyectan los cuadritos manteniendo tu diseño original -->
        <div class="track-list">
            <div class="grid" id="discographyGrid">
                <div class="loading-state">Cargando catálogo...</div>
            </div>
        </div>
    </article>

    <script>
        let catalogData = [];
        let activeFilter = 'all';
        const grid = document.getElementById('discographyGrid');

        // Carga los datos directamente desde tu archivo discography.json
        fetch('discography.json')
            .then(res => res.json())
            .then(data => {
                catalogData = data;
                renderGrid(catalogData);
            })
            .catch(err => {
                grid.innerHTML = '<div class="loading-state" style="color:#ff5555;">Error al cargar discography.json</div>';
            });

        function renderGrid(items) {
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = '<div class="loading-state">No hay elementos en esta categoría.</div>';
                return;
            }
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="card-info">
                            <h3>${item.title}</h3>
                            <p>${item.year} • ${item.artist}</p>
                        </div>
                        <a href="${item.spotifyUrl}" target="_blank" class="spotify-btn">Escuchar</a>
                    </div>
                `;
            });
        }

        // Funcionalidad para filtrar al hacer clic en tus chips
        document.querySelectorAll('.track-chips span').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.track-chips span').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                
                activeFilter = e.target.getAttribute('data-filter');
                if (activeFilter === 'all') {
                    renderGrid(catalogData);
                } else {
                    const filtered = catalogData.filter(item => 
                        item.artist.toLowerCase().includes(activeFilter.toLowerCase()) || 
                        item.title.toLowerCase().includes(activeFilter.toLowerCase())
                    );
                    renderGrid(filtered);
                }
            });
        });
    </script>
</body>
</html>
