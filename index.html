<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMY Playlist</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0 20px 0;
        }
        header h1 {
            font-size: 2.5rem;
            color: #d8b4fe;
            margin-bottom: 8px;
        }
        header p {
            color: #a7a7a7;
            font-size: 1rem;
        }

        .controls-wrapper {
            margin: 20px 0 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .search-input {
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #242424;
            color: #fff;
            width: 100%;
            max-width: 450px;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus { border-color: #1db954; }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .filter-btn {
            background-color: #242424;
            color: #b3b3b3;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #1db954;
            color: #000;
        }

        /* Espacio dedicado para la discografía */
        .discography-section {
            margin-top: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #181818;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .card:hover {
            background-color: #282828;
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .card-info h3 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: #fff;
        }
        .card-info p {
            font-size: 0.8rem;
            color: #b3b3b3;
            margin-bottom: 12px;
        }

        .spotify-btn {
            display: block;
            text-align: center;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 8px 0;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .spotify-btn:hover { background-color: #1ed760; }

        .loading-state {
            text-align: center;
            grid-column: 1 / -1;
            color: #b3b3b3;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BTS & Solo Discography Guide</h1>
            <p>Explora la discografía grupal y canciones individuales</p>
        </header>

        <div class="controls-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título, artista o año...">
            
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">Todo</button>
                <button class="filter-btn" data-filter="BTS">BTS (Grupal)</button>
                <button class="filter-btn" data-filter="Jung Kook">Jung Kook</button>
                <button class="filter-btn" data-filter="Jimin">Jimin</button>
                <button class="filter-btn" data-filter="V">V</button>
                <button class="filter-btn" data-filter="SUGA">SUGA / Agust D</button>
                <button class="filter-btn" data-filter="j-hope">j-hope</button>
                <button class="filter-btn" data-filter="RM">RM</button>
                <button class="filter-btn" data-filter="Jin">Jin</button>
            </div>
        </div>

        <!-- Área dedicada a la discografía -->
        <main class="discography-section">
            <div class="grid" id="discographyGrid">
                <div class="loading-state">Cargando catálogo...</div>
            </div>
        </main>
    </div>

    <script>
        let catalogData = [];
        let activeFilter = 'all';
        const grid = document.getElementById('discographyGrid');

        fetch('discography.json')
            .then(res => res.json())
            .then(data => {
                catalogData = data;
                renderGrid(catalogData);
            })
            .catch(err => {
                grid.innerHTML = '<div class="loading-state">Asegúrate de que discography.json exista en el repositorio.</div>';
