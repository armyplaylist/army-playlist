<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f0ff"><title>Conectando Spotify · ARMY PLAYLIST FINDER</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f0ff;color:#514064;font:700 16px Nunito,Arial,sans-serif}.box{max-width:420px;margin:20px;padding:28px;border-radius:24px;background:#fff;box-shadow:0 12px 28px #50347720;text-align:center}h1{font-size:1.4rem}p{line-height:1.6;color:#87759d}</style></head><body><main class="box"><h1>Conectando con Spotify… 💜</h1><p id="message">Estamos terminando la autorización. No cierres esta página.</p></main>
<script>
(async()=>{
 const CLIENT_ID="e50bcadfe7fa4e71b1fa83eafffa3cb8";
 const REDIRECT_URI="https://armyplaylist.github.io/army-playlist/callback";
 const params=new URLSearchParams(location.search);
 const message=document.getElementById("message");
 const fail=m=>{message.textContent=m;};
 if(params.get("error")){fail("No se autorizó la conexión. Regresa a ARMY PLAYLIST FINDER e inténtalo de nuevo.");return;}
 const code=params.get("code"),state=params.get("state"),expected=sessionStorage.getItem("armySpotifyState"),verifier=sessionStorage.getItem("armySpotifyVerifier");
 if(!code||!state||!expected||state!==expected||!verifier){fail("No pudimos validar la autorización. Vuelve a la página y pulsa Conectar con Spotify.");return;}
 try{
  const response=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:verifier})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error_description||data.error||"Spotify no pudo completar la conexión.");
  localStorage.setItem("armyPlaylistSpotifyToken",data.access_token);
  if(data.refresh_token)localStorage.setItem("armyPlaylistSpotifyRefresh",data.refresh_token);
  localStorage.setItem("armyPlaylistSpotifyExpiry",String(Date.now()+data.expires_in*1000));
  sessionStorage.removeItem("armySpotifyVerifier");sessionStorage.removeItem("armySpotifyState");
  message.textContent="¡Conexión completada! Volviendo a tu buscador…";
  location.replace("../spotify.html#mySpotifyPlaylistsPanel");
 }catch(e){fail(e.message);}
})();
</script></body></html>
